spring.application.name=sistema-automotivo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/estoque_veiculos}
spring.datasource.username=${DB_USER:estoque}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./database/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8080}
