services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_DATABASE: estoque_veiculos
      MYSQL_USER: estoque
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - mysql_dados:/var/lib/mysql
      - ./database/criar-banco-testes.sql:/docker-entrypoint-initdb.d/testes.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_dados:
